plugins {
    id 'com.android.application'
}

android {
    namespace 'eg.azolla.app'
    compileSdk 34

    defaultConfig {
        applicationId "eg.azolla.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Pure Native WebView - Zero External Dependencies for maximum safety and performance
}
